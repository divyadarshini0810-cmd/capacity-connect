# Render Blueprint: one URL serves both the React interface and Flask API.
# The managed Postgres database keeps account and course progress durable.
services:
  - type: web
    name: capacity-connect
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: capacity-connect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_BASELINE_DATA
        value: "true"

databases:
  - name: capacity-connect-db
    plan: free
